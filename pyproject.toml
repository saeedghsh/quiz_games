[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-games"
version = "0.2.0"
description = "Countdown games for the terminal and browser, sharing a Python engine"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quiz-games = "main:cli"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "pytest-mock>=3.14,<4"]
browser = ["playwright>=1.55,<2"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["countdown*", "scowl*", "utilities*"]

[tool.setuptools.package-data]
scowl = ["*.txt"]

[tool.quiz-games.browser]
pyodide-version = "0.28.3"
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"
python_files = ["test_*.py"]
markers = ["browser: real-browser tests that download Pyodide from its CDN"]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.coverage.run]
omit = ["*/tests/*", "*/config-3.py", "*/config.py"]

[tool.pylint]
init-hook = "import os, sys; sys.path.append(os.getcwd())"
max-line-length = 100

[tool.pylint."MESSAGES CONTROL"]
enable = "all"
disable = [
    "locally-disabled",
    "suppressed-message",
    "duplicate-code",
    "use-symbolic-message-instead",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "z"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
exclude = '^extras/|^temp/' # local folders I want to skip type checking
ignore_missing_imports = true
explicit_package_bases = true
strict = true
warn_unused_ignores = false # Disable warnings for unused "type: ignore"
warn_return_any = true
disable_error_code = [
    "type-arg", # Missing type parameters for generic type 'ndarray'
]
show_error_codes = true
